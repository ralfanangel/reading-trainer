<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Word Kart 3D</title>
  <style>
    html,body{margin:0;height:100%;background:#0a2040;overflow:hidden;font-family:system-ui}
    #raceArena{position:absolute;inset:0}
    #raceCanvas{width:100%;height:100%;display:block}
    #raceHud{position:absolute;left:16px;top:16px;color:#fff;font:800 20px system-ui;z-index:2;text-shadow:0 2px 10px #000}
    #raceModel{position:absolute;left:16px;top:48px;color:#ffe9b0;font:700 14px system-ui;z-index:2;text-shadow:0 2px 8px #000}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <div id="raceArena"><canvas id="raceCanvas"></canvas></div>
  <div id="raceHud">✨ 0 / 12</div>
  <div id="raceChip" class="hidden"></div>
  <div id="raceModel">Arrow keys or drag to steer · auto-accelerate</div>
  <div id="raceMessage" class="hidden"></div>
  <button id="raceNext" class="hidden"></button>
  <button id="raceGyroBtn" class="hidden"></button>
  <script src="vendor/three.min.js?v=37"></script>
  <script src="sight-words.js?v=37"></script>
  <script src="race.js?v=37"></script>
  <script>startRaceGame()</script>
</body>
</html>
