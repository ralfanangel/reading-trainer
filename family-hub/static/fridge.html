<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>v29 Family Hub</title>
  <link rel="stylesheet" href="/static/css/fridge.css?v=29">
</head>
<body>
  <div id="stage">
    <div id="photos">
      <div class="photo-frame" id="frame-a"><img id="photo-a" alt=""></div>
      <div class="photo-frame" id="frame-b"><img id="photo-b" alt=""></div>
      <div id="empty">Noch keine Fotos. Öffne die Steuerung auf dem Handy.</div>
    </div>
    <div id="vignette"></div>
    <header id="top">
      <div id="clock-block">
        <div id="clock">--:--</div>
        <div id="date"></div>
        <div id="app-version">v29</div>
        <div id="slide-remain"></div>
      </div>
    </header>
    <button type="button" id="play-pause" class="is-playing" aria-pressed="false">
      <span class="pp-icon" aria-hidden="true">
        <span class="pp-pause"></span>
        <span class="pp-play"></span>
      </span>
      <span id="play-pause-label">Play</span>
    </button>
    <div id="note" class="hidden">
      <div id="note-author"></div>
      <div id="note-text"></div>
      <div id="note-hint">Zur Seite wischen</div>
    </div>
    <div id="weather">
      <div id="weather-place">Camarillo</div>
      <div id="weather-row">
        <div id="weather-f">
          <div id="weather-temp">—</div>
          <div id="weather-meta">
            <div id="weather-cond">wird geladen</div>
            <div id="weather-range"></div>
          </div>
        </div>
        <div id="weather-c">
          <div id="weather-temp-c">—</div>
          <div id="weather-range-c"></div>
        </div>
      </div>
    </div>
    <div id="hint">Links am Rand: zurück · Rechts: weiter · Oben Play · Nachricht wischen</div>
    <button type="button" id="tap-prev" aria-label="Vorheriges Bild"></button>
    <button type="button" id="tap-next" aria-label="Nächstes Bild"></button>
  </div>

  <script src="/static/js/fridge.js?v=29"></script>
</body>
</html>
