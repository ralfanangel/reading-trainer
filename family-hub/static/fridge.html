<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>v18 Family Hub</title>
  <link rel="stylesheet" href="/static/css/fridge.css?v=v18">
</head>
<body>
  <div id="stage">
    <div id="photos">
      <img id="photo-a" alt="">
      <img id="photo-b" alt="">
      <div id="empty">Noch keine Fotos. Öffne die Steuerung auf dem Handy.</div>
    </div>
    <div id="vignette"></div>
    <header id="top">
      <div id="clock-block">
        <div id="clock">--:--</div>
        <div id="date"></div>
        <div id="app-version">v18</div>
      </div>
    </header>
    <div id="note" class="hidden">
      <div id="note-author"></div>
      <div id="note-text"></div>
    </div>
    <div id="weather">
      <div id="weather-place">Camarillo</div>
      <div id="weather-row">
        <div id="weather-temp">—</div>
        <div id="weather-meta">
          <div id="weather-cond">wird geladen</div>
          <div id="weather-range"></div>
        </div>
      </div>
    </div>
    <div id="paused" class="hidden">Pause</div>
    <div id="hint">Wischen oder tippen: zurück · weiter</div>
  </div>

  <script src="/static/js/fridge.js?v=v18"></script>
</body>
</html>
