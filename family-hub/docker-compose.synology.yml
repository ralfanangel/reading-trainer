services:
  family-hub:
    container_name: family-hub
    build: .
    ports:
      - "8755:8755"
    volumes:
      - ./data:/data
    environment:
      FAMILY_HUB_DATA: /data
      FAMILY_HUB_HOST: 0.0.0.0
      FAMILY_HUB_PORT: "8755"
      FAMILY_HUB_PUBLIC_HOST: emobilist.local
      TZ: Europe/Berlin
    restart: unless-stopped
